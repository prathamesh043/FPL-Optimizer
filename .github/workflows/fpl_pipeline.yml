name: FPL pipeline

on:
  schedule:
    - cron: '22 */3 * * *'
  workflow_dispatch:

concurrency:
  group: fpl-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
      SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
      SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
      SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
      SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
      PYTHONPATH: ${{ github.workspace }}/fpl_raw_data_ingestion:${{ github.workspace }}/fpl_squad_optimization:${{ github.workspace }}/fpl_fixtures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements-pipeline.txt
      - run: pip install -r pipeline/requirements-pipeline.txt
      - run: python pipeline/run_pipeline.py